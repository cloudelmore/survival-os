# Loopback only. LAN access is off until the user enables it.
worker_processes 1;
pid /run/survival-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    client_body_temp_path /run/survival-web/client;
    proxy_temp_path /run/survival-web/proxy;
    fastcgi_temp_path /run/survival-web/fastcgi;
    uwsgi_temp_path /run/survival-web/uwsgi;
    scgi_temp_path /run/survival-web/scgi;

    server {
        listen 127.0.0.1:8080;
        root /opt/survival-os/frontend;
        index index.html;

        # 'self' only, so the browser itself refuses any remote asset.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
