# Loopback only. LAN access is off until the user enables it.
worker_processes 1;
pid /run/survival-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    # pdf.js ships as ES modules, which browsers refuse without a script type.
    types {
        text/javascript mjs;
        application/wasm wasm;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    client_body_temp_path /run/survival-web/client;
    proxy_temp_path /run/survival-web/proxy;
    fastcgi_temp_path /run/survival-web/fastcgi;
    uwsgi_temp_path /run/survival-web/uwsgi;
    scgi_temp_path /run/survival-web/scgi;

    server {
        listen 127.0.0.1:8080;
        root /opt/survival-os/frontend;
        index index.html;

        # 'self' only, so the browser itself refuses any remote asset. pdf.js needs wasm for some
        # image formats, and data: and blob: for fonts and images embedded in the PDF.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; font-src 'self' data:; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            # Large PDFs stream through instead of landing on the tmpfs.
            proxy_max_temp_file_size 0;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
