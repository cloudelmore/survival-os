# Loopback only. LAN access is off until the user enables it.
load_module /usr/lib/nginx/modules/ngx_http_subs_filter_module.so;

worker_processes 1;
pid /run/survival-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    # pdf.js ships as ES modules, which browsers refuse without a script type.
    types {
        text/javascript mjs;
        application/wasm wasm;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    client_body_temp_path /run/survival-web/client;
    proxy_temp_path /run/survival-web/proxy;
    fastcgi_temp_path /run/survival-web/fastcgi;
    uwsgi_temp_path /run/survival-web/uwsgi;
    scgi_temp_path /run/survival-web/scgi;

    server {
        listen 127.0.0.1:8080;
        root /opt/survival-os/frontend;
        index index.html;

        # 'self' only, so the browser itself refuses any remote asset. pdf.js needs wasm for some
        # image formats, and data: and blob: for fonts and images embedded in the PDF.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; frame-src http://127.0.0.1:8083; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            # Large PDFs stream through instead of landing on the tmpfs.
            proxy_max_temp_file_size 0;
        }

        # Answers appear word by word, and the Pi may think for minutes before the first one.
        location = /api/ai/ask {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # A missing glyph range must be a 404. The dashboard page would break label parsing.
        location /maps/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Archived web pages run scripts, so they get an origin of their own. They cannot reach the
    # admin API, and this policy keeps them from loading anything from the network.
    server {
        listen 127.0.0.1:8083;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; base-uri 'none'; frame-ancestors http://127.0.0.1:8080" always;
        add_header X-Content-Type-Options nosniff always;

        location / {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $http_host;
            proxy_hide_header X-Frame-Options;
            proxy_max_temp_file_size 0;
            proxy_set_header Accept-Encoding "";
            # A new window in the kiosk has no Back bar and no way out by touch, so keep every
            # link inside the frame.
            subs_filter_types text/html;
            subs_filter "</head>" "<script>addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[target]');if(a)a.target='_self'},true);window.open=function(u){location.href=u;return window}</script></head>" i;
        }
    }
}
