[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-os"
version = "0.0.1"
description = "Backend for SURVIVAL OS, an offline knowledge platform"
requires-python = ">=3.13"
dependencies = [
    "survival-search",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["survival_os"]
