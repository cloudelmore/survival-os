name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: make setup
      - run: make test
      - run: make build
      - name: Refuse large files
        run: |
          large="$(git ls-files -z | xargs -0 du -k | awk '$1 > 5120')"
          [ -z "$large" ] || { echo "$large"; exit 1; }
